<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳思翰 & 鄭伃庭 的結婚邀請函</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f7f5f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wedding-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            body {
                padding: 20px 0;
            }
            .wedding-container {
                border-radius: 16px;
                min-height: 850px;
            }
        }

        /* 頂部標題列 */
        .header-title {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #555;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-title span {
            color: #d46a6a;
            margin: 0 4px;
        }

        /* 倒數計時區塊樣式 */
        .countdown-section {
            background: linear-gradient(135deg, #fdfbf7 0%, #f4eae1 100%);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .countdown-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: #8c7b75;
            margin-bottom: 12px;
        }

        .countdown-timers {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            min-width: 60px;
        }

        .time-number {
            font-size: 18px;
            font-weight: 600;
            color: #b56576;
        }

        .time-label {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        /* 圖片區塊與捲動進場動畫 */
        .scroll-section {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .scroll-section img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .scroll-section img.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .footer-note {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="wedding-container">
        <!-- 頂部標題 -->
        <div class="header-title">
            陳思翰 <span>❤</span> 鄭伃庭 的結婚邀請函
        </div>

        <!-- 倒數計時區塊 -->
        <div class="countdown-section">
            <div class="countdown-title">距離我們的婚禮還有</div>
            <div class="countdown-timers">
                <div class="time-box">
                    <div id="days" class="time-number">00</div>
                    <div class="time-label">天</div>
                </div>
                <div class="time-box">
                    <div id="hours" class="time-number">00</div>
                    <div class="time-label">時</div>
                </div>
                <div class="time-box">
                    <div id="minutes" class="time-number">00</div>
                    <div class="time-label">分</div>
                </div>
                <div class="time-box">
                    <div id="seconds" class="time-number">00</div>
                    <div class="time-label">秒</div>
                </div>
            </div>
        </div>

        <!-- 一頁式直式捲動圖片區塊（請將檔名改為您上傳到 GitHub 的圖片檔名） -->
        <div class="scroll-section">
            <img src="螢幕擷取畫面 2026-09-16 154153.png" alt="婚禮邀請函 頁面1">
            <img src="photo2.jpg" alt="婚禮邀請函 頁面2">
            <img src="photo3.jpg" alt="婚禮邀請函 頁面3">
            <img src="photo4.jpg" alt="婚禮邀請函 頁面4">
        </div>

        <!-- 底部結語 -->
        <div class="footer-note">
            期待您的蒞臨見證我們的幸福時刻
        </div>
    </div>

    <script>
        // 倒數計時邏輯 (目標日期：2027年3月28日)
        const weddingDate = new Date("2027-03-28T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                document.querySelector('.countdown-title').innerText = "我們已經結婚啦！";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 圖片捲動淡入動畫
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.scroll-section img').forEach(img => {
            observer.observe(img);
        });
    </script>

</body>
</html>
